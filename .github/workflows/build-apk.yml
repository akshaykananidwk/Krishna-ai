name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create android scaffolding
        working-directory: mobile
        run: flutter create .

      - name: Ensure INTERNET permission in the release manifest
        working-directory: mobile
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<manifest\(.*\)>#<manifest\1>\n    <uses-permission android:name="android.permission.INTERNET"/>#' "$MANIFEST"
          fi
          echo "----- AndroidManifest.xml -----"
          cat "$MANIFEST"

      - name: Get packages
        working-directory: mobile
        run: flutter pub get

      - name: Build APK (production URL is the default)
        working-directory: mobile
        run: flutter build apk --release --dart-define=API_BASE_URL=https://krishnaai.akdwk.in --dart-define=API_PREFIX=/api

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: krishna-ai-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
